name: Node.js CI

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: '22'

          - name: Install dependencies
            working-directory: draft-server
            run: npm install

          - name: Run tests
            working-directory: draft-server
            run: node --test naming.test.js lobby.test.js draft.test.js

    java-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            java-version: '25'
            distribution: temurin
            cache: maven
        - name: Run Java tests
          working-directory: draft-server-java
          run: mvn -B test