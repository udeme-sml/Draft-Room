name: Node.js CI

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: '22'

          - name: Install dependencies
            working-directory: draft-server
            run: npm install

          - name: Run tests
            working-directory: draft-server
            run: node --test server.test.js
                

        